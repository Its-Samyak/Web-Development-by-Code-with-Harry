    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(255 225 150)"/>
    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(270 225 150)"/>
    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(285 225 150)"/>
    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(300 225 150)"/>
    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(315 225 150)"/>
