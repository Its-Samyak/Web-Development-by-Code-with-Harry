    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(15 225 150)"/>
    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(30 225 150)"/>
    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(45 225 150)"/>
    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(60 225 150)"/>
    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(75 225 150)"/>
    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(90 225 150)"/>
    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(105 225 150)"/>
    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(120 225 150)"/>
    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(135 225 150)"/>
    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(150 225 150)"/>
    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(165 225 150)"/>
    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(180 225 150)"/>
    <line x1="225" y1="150" x2="225" y2="115" transform="rotate(195 225 150)"/>
