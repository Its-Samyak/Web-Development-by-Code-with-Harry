<svg width="450" height="300" xmlns="http://www.w3.org/2000/svg">

  <!-- Stripes -->
  <rect width="450" height="100" fill="#FF9933"/>
  <rect y="100" width="450" height="100" fill="white"/>
  <rect y="200" width="450" height="100" fill="#138808"/>

  <!-- Chakra outer ring -->
  <circle cx="225" cy="150" r="35"
          fill="none" stroke="#000080" stroke-width="2"/>

  <!-- 24 spokes -->
